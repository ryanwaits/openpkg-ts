name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  build:
    name: Build, Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install
      - run: bun run build
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun scripts/union-order-audit.ts --check

  typecheck-native:
    name: Typecheck (TS7 native, non-blocking)
    runs-on: ubuntu-latest
    # Non-blocking while the TS7 lane bakes; see plans/002 maintenance notes
    # for the flip-to-required date. A red run here must not block merges yet.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install
      # spec/sdk dist is gitignored; native tsc resolves workspace pkgs via
      # package.json exports (types: ./dist/*.d.ts). Without a build this lane
      # reports hundreds of TS2307/TS7006 errors that are not real.
      - run: bun run build
      - run: node_modules/typescript-native/bin/tsc --version
      - run: bun run typecheck:native

  test-ts-matrix:
    name: Test (typescript ${{ matrix.ts }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ts: ["5.9.3", "6.0.3"]

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Pin the workspace-wide typescript resolution for this lane only.
      # Plain version override — not the @typescript/typescript6 alias, which
      # is a stub package that cycles into an empty module under an override.
      - name: Pin typescript ${{ matrix.ts }}
        run: bun -e "const f='package.json';const j=JSON.parse(await Bun.file(f).text());j.overrides={...(j.overrides||{}),typescript:'${{ matrix.ts }}'};await Bun.write(f,JSON.stringify(j,null,2))"

      - run: bun install

      - name: Assert resolved typescript version
        run: bun -e "import ts from 'typescript';console.log('typescript',ts.version);if(!ts.version.startsWith('${{ matrix.ts }}'))process.exit(1)"

      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
